# ============================================================
# 共享内存字典：缓存路由决策结果（TTL=60s），避免每次请求打 PHP
#   key   = "$host|$request_uri"
#   value = JSON string
# ============================================================


set $dynamic_ws_url "";
set $proxy_target   "";   # direct 模式：Nginx 直连后端的完整 URL

location / {
    # ----------------------------------------------------------
    # Lua 统一路由网关
    # ----------------------------------------------------------
    access_by_lua_block {
        -- ① 管理面板路径（/proxy/*）直接放行给 PHP，不做决策
        local uri = ngx.var.request_uri
        if string.match(uri, "^/sso/") then
            return
        end

        -- ② 读路由缓存
        local upgrade   = string.lower(ngx.var.http_upgrade or "")
        local is_ws     = (upgrade == "websocket")
        local cache_key = ngx.var.host .. "|" .. uri .. (is_ws and "|ws" or "")
        local cache     = ngx.shared.route_cache
        local cached    = cache:get(cache_key)

        local cjson    = require "cjson.safe"
        local decision

        if cached then
            decision = cjson.decode(cached)
        else
            -- ③ 向 PHP 发内部 subrequest，统一获取路由决策 JSON
            local args = { uri = uri }
            if is_ws then
                args["ws"] = "1"
            end
            local res = ngx.location.capture("/internal-route-check", {
                method = ngx.HTTP_GET,
                args   = args
            })
            if res.status ~= 200 then
                ngx.log(ngx.ERR, "ROUTE_CHECK failed, status=" .. res.status)
                ngx.exit(502)
            end
            decision = cjson.decode(res.body)
            if not decision then
                ngx.log(ngx.ERR, "ROUTE_CHECK invalid JSON: " .. (res.body or ""))
                ngx.exit(502)
            end
            -- 缓存 direct / websocket 决策
            if decision.action == "direct" or decision.action == "websocket" then
                cache:set(cache_key, res.body, 3600)  -- TTL=3600s
            end
        end

        -- ④ 按决策分流
        if decision.action == "reject" then
            -- 如果 PHP 返回了需要设置的 cookie（比如 SSO 流程预先写入的 session），
            -- 将这些 Set-Cookie 值透传给客户端，然后再重定向。
            if decision.cookies and type(decision.cookies) == "table" then
                for _, ck in ipairs(decision.cookies) do
                    -- 确保 ngx.header['Set-Cookie'] 是表格以支持多值
                    if not ngx.header['Set-Cookie'] then
                        ngx.header['Set-Cookie'] = { ck }
                    else
                        -- 追加到现有的 Set-Cookie 列表
                        if type(ngx.header['Set-Cookie']) == 'table' then
                            table.insert(ngx.header['Set-Cookie'], ck)
                        else
                            ngx.header['Set-Cookie'] = { ngx.header['Set-Cookie'], ck }
                        end
                    end
                end
            end
            return ngx.redirect(decision.redirect, 302)

        elseif decision.action == "websocket" then
            ngx.var.dynamic_ws_url = decision.target
            return ngx.exec("@websocket_proxy")

        elseif decision.action == "direct" then
            ngx.var.proxy_target = decision.target
            return ngx.exec("@direct_proxy")

        end
        -- action == "php"：放行，把决策元信息传给 PHP
        if decision.rewrite then
            ngx.req.set_header("X-Route-Rewrite", "1")
        end
    }

    # 普通请求（需要 PHP 完整代理：HTML 注入、URL 重写等）
    try_files $uri $uri/ /index.php$is_args$query_string;
}

# ============================================================
# Nginx 直连后端（零 PHP 开销）
# ============================================================
location @direct_proxy {
    proxy_pass              $proxy_target;
    proxy_http_version      1.1;
    proxy_set_header        Connection          "";
    proxy_set_header        Host                $host;
    proxy_set_header        X-Real-IP           $remote_addr;
    proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto   $scheme;

    # 流式大文件不落磁盘
    proxy_buffering         off;
    proxy_read_timeout      60s;
    proxy_connect_timeout   5s;
    proxy_send_timeout      60s;
}

# ============================================================
# WebSocket 代理
# ============================================================
location @websocket_proxy {
    if ($dynamic_ws_url = "") {
        return 502;
    }
    proxy_pass              $dynamic_ws_url;
    proxy_http_version      1.1;
    proxy_set_header        Upgrade             $http_upgrade;
    proxy_set_header        Connection          "upgrade";
    proxy_set_header        Host                $host;
    proxy_set_header        X-Real-IP           $remote_addr;
    proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_read_timeout      86400s;
}

# ============================================================
# 内部接口：PHP 统一路由决策
# ============================================================
location = /internal-route-check {
    internal;
    fastcgi_pass        127.0.0.1:9000;
    include             fastcgi_params;
    fastcgi_param       SCRIPT_FILENAME     $document_root/index.php;
    fastcgi_param       REQUEST_URI         /proxy/route_check;
    fastcgi_param       QUERY_STRING        $args;
    # 传递 Cookie 供 PHP 鉴权
    fastcgi_param       HTTP_COOKIE         $http_cookie;
}
